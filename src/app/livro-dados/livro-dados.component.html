<main class="container page-shell py-4 py-md-5">
  <div class="mb-4">
    <a routerLink="/lista" class="link-secondary text-decoration-none">← Voltar ao catálogo</a>
    <p class="text-primary fw-semibold small text-uppercase mt-4 mb-1">Cadastro</p>
    <h1 class="h2 mb-1">Dados do Livro</h1>
    <p class="text-secondary mb-0">Preencha os campos para adicionar um título ao catálogo.</p>
  </div>

  <div class="card p-4 p-md-5">
    <form (submit)="incluir()" ngNativeValidate>
      <div class="mb-3">
        <label for="titulo" class="form-label">Título <span class="text-danger">*</span></label>
        <input id="titulo" name="titulo" class="form-control" type="text"
               [(ngModel)]="livro.titulo" required minlength="2" maxlength="120"
               placeholder="Ex.: Use a Cabeça: Java">
      </div>

      <div class="mb-3">
        <label for="resumo" class="form-label">Resumo <span class="text-danger">*</span></label>
        <textarea id="resumo" name="resumo" class="form-control" rows="4"
                  [(ngModel)]="livro.resumo" required minlength="5" maxlength="600"
                  placeholder="Escreva uma breve descrição do livro"></textarea>
      </div>

      <div class="mb-3">
        <label for="editora" class="form-label">Editora <span class="text-danger">*</span></label>
        <select id="editora" name="codEditora" class="form-select"
                [(ngModel)]="livro.codEditora" required>
          <option *ngFor="let editora of editoras" [ngValue]="editora.codEditora">
            {{ editora.nome }}
          </option>
        </select>
      </div>

      <div class="mb-4">
        <label for="autores" class="form-label">Autores <span class="text-danger">*</span></label>
        <textarea id="autores" name="autoresForm" class="form-control" rows="3"
                  [(ngModel)]="autoresForm" required
                  placeholder="Um autor por linha"></textarea>
        <div class="form-text">Informe pelo menos um autor; use uma linha para cada nome.</div>
      </div>

      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary" type="submit">Salvar Dados</button>
        <a class="btn btn-outline-secondary" routerLink="/lista">Cancelar</a>
      </div>
      <p class="required-note text-secondary mt-3 mb-0">* Campos obrigatórios, com validação nativa do navegador.</p>
    </form>
  </div>
</main>
